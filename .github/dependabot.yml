version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      all-dependencies:
        applies-to: version-updates
        patterns: ["*"]
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
