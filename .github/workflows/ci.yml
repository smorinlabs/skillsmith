name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Temporary probe only: do not merge. All jobs are cheap result fixtures.
jobs:
  fast-lint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Deliberate fast-check failure
        run: exit 1
  fast-typecheck:
    needs: [fast-lint]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - run: echo 'This job must be skipped after its failed dependency'
  fast-static:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - run: 'true'
  ordinary-check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - run: 'true'
  test-shard:
    name: Test shard (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Deliberately fail one matrix member
        env:
          SHARD: ${{ matrix.shard }}
        run: test "$SHARD" != '2'
  test-shard-aggregate:
    name: Test shard aggregate
    needs: [test-shard]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Require every shard to succeed
        env:
          SHARD_RESULT: ${{ needs.test-shard.result }}
        run: |
          if [ "$SHARD_RESULT" != "success" ]; then
            echo "test-shard result is $SHARD_RESULT; expected success" >&2
            exit 1
          fi
  native-receipt:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - run: echo 'This job is deliberately skipped'
  lint-pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - run: 'true'
  agent-environments:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - run: 'true'

  # One stable required check for all product CI jobs. No checkout or network
  # is needed to report failures, including failed or skipped dependencies.
  ci-result:
    name: CI result
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: ${{ always() }}
    needs: [fast-lint, fast-typecheck, fast-static, ordinary-check, test-shard, test-shard-aggregate, native-receipt, lint-pr-title, agent-environments]
    permissions:
      contents: read
    steps:
      - name: Require every CI result
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          REQUIRED_JOBS: fast-lint,fast-typecheck,fast-static,ordinary-check,test-shard,test-shard-aggregate,native-receipt,lint-pr-title,agent-environments
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          required = os.environ['REQUIRED_JOBS'].split(',')
          needs = json.loads(os.environ['NEEDS_JSON'])
          event = os.environ['EVENT_NAME']
          errors = []
          if event not in ('pull_request', 'push'):
              errors.append(f'Unexpected CI event: {event}')
          if not isinstance(needs, dict) or set(needs) != set(required):
              errors.append('CI dependency results do not match the required job roster')
          if isinstance(needs, dict):
              for job in required:
                  value = needs.get(job)
                  result = value.get('result') if isinstance(value, dict) else None
                  expected = 'skipped' if job == 'lint-pr-title' and event == 'push' else 'success'
                  print(f'{job}: {result} (expected {expected})')
                  if result != expected:
                      errors.append(f'{job}: expected {expected}, received {result}')
          if errors:
              print('\n'.join(errors), file=sys.stderr)
              sys.exit(1)
          print('All required CI jobs passed')
          PY
