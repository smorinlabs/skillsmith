name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ordinary-check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.50.0
      - name: Install dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install exact actionlint
        run: |
          tool_bin="$RUNNER_TEMP/skillsmith-tools"
          SKILLSMITH_TOOL_BIN_DIR="$tool_bin" ./scripts/install-actionlint.sh
          echo "$tool_bin" >> "$GITHUB_PATH"
      - name: Canonical repository gate
        run: just check

  native-receipt:
    name: Native receipt (${{ matrix.lane }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            lane: linux-arm64
          - runner: macos-15
            lane: darwin-arm64
          - runner: macos-15-intel
            lane: darwin-x64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: runner.os == 'macOS'
        with:
          node-version: 24
      - name: Install pinned npm
        if: runner.os == 'macOS'
        run: |
          npm_prefix="$RUNNER_TEMP/skillsmith-npm-12.0.1"
          npm install --global --prefix "$npm_prefix" npm@12.0.1
          echo "$npm_prefix/bin" >> "$GITHUB_PATH"
      - name: Install pinned GoReleaser
        if: runner.os == 'macOS'
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.17.1
          install-only: true
      - name: Host-native build and smoke
        env:
          EXPECTED_LANE: ${{ matrix.lane }}
        run: |
          bun run build
          test "$(./dist/skillsmith version)" = "$(bun -p "import('./package.json').then(p => p.default.version)")"
          ./dist/skillsmith agents --capabilities --format json >/dev/null
      - name: Candidate-cask contract on macOS
        if: runner.os == 'macOS'
        env:
          P17_G6_01_HOMEBREW_RECEIPT: '1'
        run: >-
          bun test tests/ergonomics/phase/EWP-P6-TS01.test.ts
          --timeout 300000
          --max-concurrency 1
          --test-name-pattern 'EWP-P6-TS01.*Homebrew supported-platform'

  lint-pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | bunx commitlint
