name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: P17 G6-01 Homebrew supported-platform receipt
        if: matrix.os == 'macos-15'
        env:
          P17_G6_01_HOMEBREW_RECEIPT: '1'
        run: >-
          bun test tests/ergonomics/phase/EWP-P6-TS01.test.ts
          --timeout 300000
          --max-concurrency 1
          --test-name-pattern 'EWP-P6-TS01.*Homebrew supported-platform'

      - name: Biome (CI mode)
        run: bunx @biomejs/biome ci

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: P17 WF03 platform receipt
        run: bun test tests/ergonomics/workflows/EWP-WF03.test.ts --test-name-pattern EWP-WF03

      - name: Test
        env:
          TMPDIR: ${{ runner.temp }}/skillsmith-tests
        run: |
          test_bin="$RUNNER_TEMP/skillsmith-test-bin"
          test_path="$RUNNER_TEMP/skillsmith-test-path"
          mkdir -p "$TMPDIR" "$test_bin" "$test_path"
          IFS=:
          for path_dir in $PATH; do
            [ -d "$path_dir" ] || continue
            for executable in "$path_dir"/*; do
              [ -x "$executable" ] || continue
              [ -d "$executable" ] && continue
              executable_name="${executable##*/}"
              case "$executable_name" in
                claude|codex) continue ;;
              esac
              [ -e "$test_path/$executable_name" ] ||
                ln -s "$executable" "$test_path/$executable_name"
            done
          done
          unset IFS
          # Preserve variables for the generated stub rather than this workflow shell.
          # shellcheck disable=SC2016
          printf '%s\n' \
            '#!/bin/sh' \
            '[ "$#" -eq 1 ] && [ "$1" = "--version" ] || exit 64' \
            'printf "%s\\n" "2.1.207 (Claude Code)"' \
            > "$test_bin/claude"
          # Preserve variables for the generated stub rather than this workflow shell.
          # shellcheck disable=SC2016
          printf '%s\n' \
            '#!/bin/sh' \
            '[ "$#" -eq 1 ] && [ "$1" = "--version" ] || exit 64' \
            'printf "%s\\n" "codex-cli 0.144.1"' \
            > "$test_bin/codex"
          chmod 0755 "$test_bin/claude" "$test_bin/codex"
          PATH="$test_bin:$test_path" bun test --timeout 60000 --max-concurrency 1

      - name: Install actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          echo "$PWD" >> "$GITHUB_PATH"

      - name: actionlint
        run: actionlint

      - name: ESLint boundaries (import paths, core isolation)
        run: bun run lint:boundaries

      - name: Build binary (smoke)
        env:
          RUNNER_OS: ${{ runner.os }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            TARGET=bun-darwin-arm64
          else
            TARGET=bun-linux-x64
          fi
          bun build --compile --bytecode --target=$TARGET packages/cli/src/index.ts --outfile dist/skillsmith

      - name: Binary smoke run
        run: ./dist/skillsmith agents --format json

  lint-pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | bunx commitlint
