name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome (CI mode)
        run: bunx @biomejs/biome ci

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Test
        run: bun test

      - name: Install actionlint
        uses: raven-actions/actionlint@v2

      - name: ESLint boundaries (import paths, core isolation)
        run: bun run lint:boundaries

      - name: Build binary (smoke)
        env:
          RUNNER_OS: ${{ runner.os }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            TARGET=bun-darwin-arm64
          else
            TARGET=bun-linux-x64
          fi
          bun build --compile --bytecode --target=$TARGET packages/cli/src/index.ts --outfile dist/skillsmith

      - name: Binary smoke run
        run: ./dist/skillsmith agents --format json

  lint-pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | bunx commitlint
