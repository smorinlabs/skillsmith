name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Run the seven non-test checks in parallel with the four test shards.
  fast-lint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Lint with Biome (same command as just check)
        run: bun run lint
      - name: Enforce import boundaries (same command as just check)
        run: bun run lint:boundaries

  fast-typecheck:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Typecheck (same command as just check)
        run: bun run typecheck
      - name: Check generated references (same command as just check)
        run: bun scripts/generate-command-reference.ts --check

  fast-static:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.50.0
      - name: Install dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install exact actionlint and credential scanners
        run: |
          tool_bin="$RUNNER_TEMP/skillsmith-tools"
          SKILLSMITH_TOOL_BIN_DIR="$tool_bin" ./scripts/install-actionlint.sh
          SKILLSMITH_TOOL_BIN_DIR="$tool_bin" ./scripts/install-gitleaks.sh
          SKILLSMITH_TOOL_BIN_DIR="$tool_bin" ./scripts/install-trufflehog.sh
          echo "$tool_bin" >> "$GITHUB_PATH"
      - name: Secret scan (same command as just check)
        run: just secrets
      - name: Lint workflows (same command as just check)
        run: bun run actions-lint
      - name: P17 check (same command as just check)
        run: just p17-check

  ordinary-check:
    name: Ordinary environment prerequisites
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.50.0
      - name: Install dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install exact actionlint and credential scanners
        run: |
          tool_bin="$RUNNER_TEMP/skillsmith-tools"
          SKILLSMITH_TOOL_BIN_DIR="$tool_bin" ./scripts/install-actionlint.sh
          SKILLSMITH_TOOL_BIN_DIR="$tool_bin" ./scripts/install-gitleaks.sh
          SKILLSMITH_TOOL_BIN_DIR="$tool_bin" ./scripts/install-trufflehog.sh
          echo "$tool_bin" >> "$GITHUB_PATH"
      - name: Set up Node for pinned release-test npm
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Prepare ordinary agent-tool reports
        id: ordinary_agent_reports
        run: |
          report_root=$(mktemp -d "$RUNNER_TEMP/skillsmith-ordinary-agent-reports.XXXXXX")
          report_children="$report_root/children"
          mkdir "$report_children"
          echo "ORDINARY_AGENT_REPORT_ROOT=$report_root" >> "$GITHUB_ENV"
          echo "ORDINARY_AGENT_REPORT_CHILDREN=$report_children" >> "$GITHUB_ENV"
          {
            git rev-parse HEAD 'HEAD^{tree}'
            node --version
            npm --version
            bun --version
            git --version
          } > "$report_root/source-and-runtimes.txt"
      - name: Install exact ordinary agent tools
        id: ordinary_agent_tools
        run: |
          agent_root="$RUNNER_TEMP/skillsmith-ordinary-agent-tools"
          set +e
          bun scripts/install-ci-agent-tools.ts --root "$agent_root" > "$ORDINARY_AGENT_REPORT_ROOT/installer.stdout" 2> "$ORDINARY_AGENT_REPORT_ROOT/installer.stderr"
          result=$?
          set -e
          cat "$ORDINARY_AGENT_REPORT_ROOT/installer.stdout"
          cat "$ORDINARY_AGENT_REPORT_ROOT/installer.stderr" >&2
          if [ "$result" -ne 0 ]; then exit "$result"; fi
          echo "ORDINARY_AGENT_PREFIX=$agent_root/prefix" >> "$GITHUB_ENV"
          echo "$agent_root/prefix/bin" >> "$GITHUB_PATH"
      - name: Check ordinary agent command bindings
        run: |
          for name in claude codex kilo opencode muse; do
            expected="$ORDINARY_AGENT_PREFIX/bin/$name"
            actual=$(command -v "$name" || true)
            printf '%s\t%s\n' "$name" "$actual" >> "$ORDINARY_AGENT_REPORT_ROOT/command-bindings.txt"
            if [ "$actual" != "$expected" ]; then
              echo "expected $name at $expected, found $actual" >&2
              exit 1
            fi
            timeout --signal=TERM --kill-after=5s 30s "$actual" --version > "$ORDINARY_AGENT_REPORT_ROOT/$name.version.stdout" 2> "$ORDINARY_AGENT_REPORT_ROOT/$name.version.stderr"
          done
      - name: Check ordinary agent discovery and install prerequisites
        env:
          SKILLSMITH_CI_AGENT_MODE: present
          SKILLSMITH_CI_AGENT_PREFIX: ${{ env.ORDINARY_AGENT_PREFIX }}
          SKILLSMITH_CI_AGENT_REPORT_DIR: ${{ env.ORDINARY_AGENT_REPORT_CHILDREN }}
        run: |
          set +e
          bun test ./packages/cli/tests/commands/agent-environments.test.ts --timeout=60000 --max-concurrency=1 --no-orphans --retry=0 --reporter=junit --reporter-outfile="$ORDINARY_AGENT_REPORT_ROOT/agent-environments.xml" > "$ORDINARY_AGENT_REPORT_ROOT/agent-environments.stdout" 2> "$ORDINARY_AGENT_REPORT_ROOT/agent-environments.stderr"
          result=$?
          set -e
          cat "$ORDINARY_AGENT_REPORT_ROOT/agent-environments.stdout"
          cat "$ORDINARY_AGENT_REPORT_ROOT/agent-environments.stderr" >&2
          exit "$result"
      - name: Install pinned release-test npm in owned prefix
        run: |
          npm_prefix="$RUNNER_TEMP/skillsmith-ordinary-npm-12.0.1"
          npm install --global --prefix "$npm_prefix" --engine-strict --ignore-scripts --no-audit --no-fund npm@12.0.1
          echo "$npm_prefix/bin" >> "$GITHUB_PATH"
      - name: Install pinned release-test GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
        with:
          version: v2.17.1
          install-only: true
      - name: Check exact release-test tool versions before canonical gate
        run: |
          bun --eval '
          import { spawnSync } from "node:child_process";
          import { assertReleaseToolVersions } from "./scripts/release-artifacts.ts";

          const probe = (name) => {
            const executable = Bun.which(name);
            if (executable === null) throw new Error("required release-test tool missing from PATH: " + name);
            const result = spawnSync(executable, ["--version"], {
              cwd: process.cwd(),
              env: process.env,
              encoding: "utf8",
              timeout: 30000,
              maxBuffer: 1024 * 1024,
            });
            console.log(JSON.stringify({
              tool: name,
              executable,
              status: result.status,
              signal: result.signal,
              stdout: result.stdout,
              stderr: result.stderr,
              error: result.error?.message ?? null,
            }));
            if (result.error || result.signal !== null || result.status !== 0) {
              throw new Error("native version probe failed: " + name);
            }
            return result.stdout.trim();
          };
          const versions = {
            bun: probe("bun"),
            goreleaser: probe("goreleaser").match(/GitVersion:\s*v?([^\s]+)/u)?.[1] ?? "",
            npm: probe("npm"),
          };
          assertReleaseToolVersions(versions);
          console.log(JSON.stringify({ status: "EXACT_RELEASE_TEST_TOOL_VERSIONS_CONFIRMED", versions }));
          '
      - name: Retain ordinary agent-tool evidence
        if: ${{ always() && !cancelled() && steps.ordinary_agent_reports.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: ordinary-agent-tools-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          include-hidden-files: true
          path: |
            ${{ env.ORDINARY_AGENT_REPORT_ROOT }}/*.txt
            ${{ env.ORDINARY_AGENT_REPORT_ROOT }}/*.xml
            ${{ env.ORDINARY_AGENT_REPORT_ROOT }}/*.stdout
            ${{ env.ORDINARY_AGENT_REPORT_ROOT }}/*.stderr
            ${{ env.ORDINARY_AGENT_REPORT_ROOT }}/children/*/*.json
            ${{ env.ORDINARY_AGENT_REPORT_ROOT }}/children/*/*.stdout
            ${{ env.ORDINARY_AGENT_REPORT_ROOT }}/children/*/*.stderr
            ${{ env.ORDINARY_AGENT_REPORT_ROOT }}/children/*/.detection-*/preload.ts
            ${{ env.ORDINARY_AGENT_REPORT_ROOT }}/children/*/.detection-*/trace.txt
            ${{ env.ORDINARY_AGENT_REPORT_ROOT }}/children/*/.detection-*/receipt.json
            ${{ runner.temp }}/skillsmith-ordinary-agent-tools/receipt.json
            ${{ runner.temp }}/skillsmith-ordinary-agent-tools/logs

  # Shard the test terminal across 4 parallel jobs. Each shard
  # provisions every prerequisite ordinary-check provides before the test
  # terminal: scanners, the exact ordinary agent tools on PATH (EWP-WF02/WF14
  # install through a detected claude-code), Node 24, pinned npm 12.0.1, and
  # install-only GoReleaser v2.17.1 (EWP-P6-TS01 candidate builds).
  test-shard:
    name: Test shard (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install exact actionlint and credential scanners
        run: |
          tool_bin="$RUNNER_TEMP/skillsmith-tools"
          SKILLSMITH_TOOL_BIN_DIR="$tool_bin" ./scripts/install-actionlint.sh
          SKILLSMITH_TOOL_BIN_DIR="$tool_bin" ./scripts/install-gitleaks.sh
          SKILLSMITH_TOOL_BIN_DIR="$tool_bin" ./scripts/install-trufflehog.sh
          echo "$tool_bin" >> "$GITHUB_PATH"
      - name: Set up Node for pinned release-test npm
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24'
      - name: Install exact ordinary agent tools
        run: |
          agent_root="$RUNNER_TEMP/skillsmith-ordinary-agent-tools"
          bun scripts/install-ci-agent-tools.ts --root "$agent_root"
          echo "ORDINARY_AGENT_PREFIX=$agent_root/prefix" >> "$GITHUB_ENV"
          echo "$agent_root/prefix/bin" >> "$GITHUB_PATH"
      - name: Check ordinary agent command bindings
        run: |
          for name in claude codex kilo opencode muse; do
            expected="$ORDINARY_AGENT_PREFIX/bin/$name"
            actual=$(command -v "$name" || true)
            if [ "$actual" != "$expected" ]; then
              echo "expected $name at $expected, found $actual" >&2
              exit 1
            fi
            timeout --signal=TERM --kill-after=5s 30s "$actual" --version
          done
      - name: Install pinned release-test npm in owned prefix
        run: |
          npm_prefix="$RUNNER_TEMP/skillsmith-ordinary-npm-12.0.1"
          npm install --global --prefix "$npm_prefix" --engine-strict --ignore-scripts --no-audit --no-fund npm@12.0.1
          echo "$npm_prefix/bin" >> "$GITHUB_PATH"
      - name: Install pinned release-test GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
        with:
          version: v2.17.1
          install-only: true
      - name: Check exact release-test tool versions before canonical gate
        run: |
          bun --eval '
          import { spawnSync } from "node:child_process";
          import { assertReleaseToolVersions } from "./scripts/release-artifacts.ts";

          const probe = (name) => {
            const executable = Bun.which(name);
            if (executable === null) throw new Error("required release-test tool missing from PATH: " + name);
            const result = spawnSync(executable, ["--version"], {
              cwd: process.cwd(),
              env: process.env,
              encoding: "utf8",
              timeout: 30000,
              maxBuffer: 1024 * 1024,
            });
            console.log(JSON.stringify({
              tool: name,
              executable,
              status: result.status,
              signal: result.signal,
              stdout: result.stdout,
              stderr: result.stderr,
              error: result.error?.message ?? null,
            }));
            if (result.error || result.signal !== null || result.status !== 0) {
              throw new Error("native version probe failed: " + name);
            }
            return result.stdout.trim();
          };
          const versions = {
            bun: probe("bun"),
            goreleaser: probe("goreleaser").match(/GitVersion:\s*v?([^\s]+)/u)?.[1] ?? "",
            npm: probe("npm"),
          };
          assertReleaseToolVersions(versions);
          console.log(JSON.stringify({ status: "EXACT_RELEASE_TEST_TOOL_VERSIONS_CONFIRMED", versions }));
          '
      - name: Run test shard
        run: bun scripts/run-test-files-shard.ts --shard-index=${{ matrix.shard }} --shard-total=4 --out-dir="$RUNNER_TEMP/test-shard-${{ matrix.shard }}"
      - name: Retain shard evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: test-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: ${{ runner.temp }}/test-shard-${{ matrix.shard }}/

  # Restore the serial runner's global checks over the union of
  # shard evidence (manifest coverage exactly once, skip-allowlist totals).
  # It runs even when a shard fails so the check reports failure, never skipped.
  test-shard-aggregate:
    name: Test shard aggregate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [test-shard]
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    steps:
      - name: Require every shard to succeed
        env:
          SHARD_RESULT: ${{ needs.test-shard.result }}
        run: |
          if [ "$SHARD_RESULT" != "success" ]; then
            echo "test-shard result is $SHARD_RESULT; expected success" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Download shard evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: test-shard-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/shard-evidence
      - name: Validate shard union
        run: bun scripts/aggregate-shard-receipts.ts --receipts="$RUNNER_TEMP/shard-evidence" --shard-total=4

  # One stable required check for all product CI jobs. No checkout or network
  # is needed to report failures, including failed or skipped dependencies.
  ci-result:
    name: CI result
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: ${{ always() }}
    needs: [fast-lint, fast-typecheck, fast-static, ordinary-check, test-shard, test-shard-aggregate, native-receipt, lint-pr-title, agent-environments]
    permissions:
      contents: read
    steps:
      - name: Require every CI result
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          REQUIRED_JOBS: fast-lint,fast-typecheck,fast-static,ordinary-check,test-shard,test-shard-aggregate,native-receipt,lint-pr-title,agent-environments
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          required = os.environ['REQUIRED_JOBS'].split(',')
          needs = json.loads(os.environ['NEEDS_JSON'])
          event = os.environ['EVENT_NAME']
          errors = []
          if event not in ('pull_request', 'push'):
              errors.append(f'Unexpected CI event: {event}')
          if not isinstance(needs, dict) or set(needs) != set(required):
              errors.append('CI dependency results do not match the required job roster')
          if isinstance(needs, dict):
              for job in required:
                  value = needs.get(job)
                  result = value.get('result') if isinstance(value, dict) else None
                  expected = 'skipped' if job == 'lint-pr-title' and event == 'push' else 'success'
                  print(f'{job}: {result} (expected {expected})')
                  if result != expected:
                      errors.append(f'{job}: expected {expected}, received {result}')
          if errors:
              print('\n'.join(errors), file=sys.stderr)
              sys.exit(1)
          print('All required CI jobs passed')
          PY

  native-receipt:
    name: Native receipt (${{ matrix.lane }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            lane: linux-arm64
          - runner: macos-15
            lane: darwin-arm64
          - runner: macos-15-intel
            lane: darwin-x64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Host-native build and smoke
        env:
          EXPECTED_LANE: ${{ matrix.lane }}
        run: |
          bun run build
          test "$(./dist/skillsmith version)" = "$(bun -p "import('./package.json').then(p => p.default.version)")"
          ./dist/skillsmith agents --capabilities --format json >/dev/null

  lint-pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | bunx commitlint

  agent-environments:
    name: Agent environments (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        mode: [present, absent]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24'
      - name: Install dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Prepare owned reports
        id: reports
        run: |
          report_root=$(mktemp -d "$RUNNER_TEMP/skillsmith-agent-reports.XXXXXX")
          mkdir "$report_root/children"
          echo "AGENT_REPORT_ROOT=$report_root" >> "$GITHUB_ENV"
          echo "SKILLSMITH_CI_AGENT_REPORT_DIR=$report_root/children" >> "$GITHUB_ENV"
          {
            git rev-parse HEAD 'HEAD^{tree}'
            node --version
            npm --version
            bun --version
            git --version
          } > "$report_root/source-and-runtimes.txt"
      - name: Install exact owned agent tools
        id: tools
        if: matrix.mode == 'present'
        run: |
          set +e
          bun scripts/install-ci-agent-tools.ts --root "$RUNNER_TEMP/skillsmith-ci-agent-tools" > "$AGENT_REPORT_ROOT/installer.stdout" 2> "$AGENT_REPORT_ROOT/installer.stderr"
          result=$?
          set -e
          cat "$AGENT_REPORT_ROOT/installer.stdout"
          cat "$AGENT_REPORT_ROOT/installer.stderr" >&2
          if [ "$result" -ne 0 ]; then exit "$result"; fi
          echo "SKILLSMITH_CI_AGENT_PREFIX=$RUNNER_TEMP/skillsmith-ci-agent-tools/prefix" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/skillsmith-ci-agent-tools/prefix/bin" >> "$GITHUB_PATH"
      - name: Check agent discovery and install prerequisites
        env:
          SKILLSMITH_CI_AGENT_MODE: ${{ matrix.mode }}
        run: |
          set +e
          bun test ./packages/cli/tests/commands/agent-environments.test.ts --timeout=60000 --max-concurrency=1 --no-orphans --retry=0 --reporter=junit --reporter-outfile="$AGENT_REPORT_ROOT/agent-environments.xml" > "$AGENT_REPORT_ROOT/agent-environments.stdout" 2> "$AGENT_REPORT_ROOT/agent-environments.stderr"
          result=$?
          set -e
          cat "$AGENT_REPORT_ROOT/agent-environments.stdout"
          cat "$AGENT_REPORT_ROOT/agent-environments.stderr" >&2
          exit "$result"
      - name: Check P4A fixture independence
        if: ${{ !cancelled() && steps.reports.outcome == 'success' && (matrix.mode == 'absent' || steps.tools.outcome == 'success') }}
        run: |
          set +e
          bun test ./tests/ergonomics/phase/EWP-P4A-TS01.test.ts --timeout=60000 --max-concurrency=1 --no-orphans --retry=0 --reporter=junit --reporter-outfile="$AGENT_REPORT_ROOT/p4a-fixtures.xml" > "$AGENT_REPORT_ROOT/p4a-fixtures.stdout" 2> "$AGENT_REPORT_ROOT/p4a-fixtures.stderr"
          result=$?
          set -e
          cat "$AGENT_REPORT_ROOT/p4a-fixtures.stdout"
          cat "$AGENT_REPORT_ROOT/p4a-fixtures.stderr" >&2
          exit "$result"
      - name: Retain owned agent environment evidence
        if: ${{ !cancelled() && steps.reports.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: agent-environments-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          include-hidden-files: true
          path: |
            ${{ env.AGENT_REPORT_ROOT }}/*.txt
            ${{ env.AGENT_REPORT_ROOT }}/*.xml
            ${{ env.AGENT_REPORT_ROOT }}/*.stdout
            ${{ env.AGENT_REPORT_ROOT }}/*.stderr
            ${{ env.AGENT_REPORT_ROOT }}/children/*/*.json
            ${{ env.AGENT_REPORT_ROOT }}/children/*/*.stdout
            ${{ env.AGENT_REPORT_ROOT }}/children/*/*.stderr
            ${{ env.AGENT_REPORT_ROOT }}/children/*/.detection-*/preload.ts
            ${{ env.AGENT_REPORT_ROOT }}/children/*/.detection-*/trace.txt
            ${{ env.AGENT_REPORT_ROOT }}/children/*/.detection-*/receipt.json
            ${{ runner.temp }}/skillsmith-ci-agent-tools/receipt.json
            ${{ runner.temp }}/skillsmith-ci-agent-tools/logs
