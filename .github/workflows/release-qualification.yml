name: Release qualification

# P19 Q2.A: required release evidence, not automatic product PR validation.
# Publication/pre-publication execution remains held under #53. Do not dispatch
# until the release owner explicitly resumes it; #52/#58 retain outstanding work.
on:
  workflow_dispatch:
    inputs:
      resume_release_qualification:
        description: Release owner explicitly authorized resuming candidate qualification
        required: true
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate-cask:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.resume_release_qualification }}
    name: Candidate cask (${{ matrix.lane }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            lane: darwin-arm64
          - runner: macos-15-intel
            lane: darwin-x64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Install pinned npm
        run: |
          npm_prefix="$RUNNER_TEMP/skillsmith-npm-12.0.1"
          npm install --global --prefix "$npm_prefix" npm@12.0.1
          echo "$npm_prefix/bin" >> "$GITHUB_PATH"
      - name: Install pinned GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.17.1
          install-only: true
      - name: Candidate-cask contract on macOS
        env:
          P17_G6_01_HOMEBREW_RECEIPT: '1'
        run: >-
          bun test tests/ergonomics/phase/EWP-P6-TS01.test.ts
          --timeout 300000
          --max-concurrency 1
          --test-name-pattern 'EWP-P6-TS01.*Homebrew supported-platform'
