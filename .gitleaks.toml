title = "skillsmith gitleaks config"

[extend]
useDefault = true

# All directories are scanned. Exceptions require an exact file AND an exact
# extracted value and affect only the detector responsible for the false positive.
[[allowlists]]
description = "Invalid value used by manifest sensitive-content rejection tests"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
paths = ['''^packages/core/tests/artifacts/manifest(-edit)?\.test\.ts$''']
regexes = ['''^ghp_P17SECRET1$''']

[[allowlists]]
description = "Named output-redaction canary, not an authentication value"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
paths = ['''^tests/ergonomics/fixtures/p4b-apply/cases\.ts$''']
regexes = ['''^P17_SECRET_CANARY_APPLY_ENV$''']

[[allowlists]]
description = "Prose about excluded portable paths, retained in Git history"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
paths = ['''^projects/p17/evidence/P17-G4A-01\.md$''']
regexes = ['''^absolute/escaping$''']

[[allowlists]]
description = "Prose about configuration leak checks, retained in Git history"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
paths = ['''^projects/p17/evidence/P17-G6-01\.md$''']
regexes = ['''^dotenv/bunfig$''']
