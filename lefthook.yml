pre-commit:
  parallel: true
  commands:
    biome:
      glob: "**/*.{ts,tsx,js,jsx,json,jsonc}"
      run: bunx @biomejs/biome check --no-errors-on-unmatched --staged {staged_files}
    eslint-boundaries:
      glob: "packages/*/{src,tests}/**/*.ts"
      run: bunx eslint --no-warn-ignored {staged_files}
    actionlint:
      glob: ".github/workflows/*.{yml,yaml}"
      run: actionlint {staged_files}
    gitleaks:
      run: ./scripts/check-gitleaks.sh staged

pre-push:
  commands:
    typecheck:
      run: bunx tsc --noEmit
    test:
      run: bun scripts/run-test-files-serial.ts
    gitleaks:
      run: ./scripts/check-gitleaks.sh full
    audit:
      run: bun audit --audit-level=high
    eslint-security:
      run: bunx eslint --config eslint.security.config.js --suppressions-location eslint-security-suppressions.json --max-warnings 0 'packages/*/src/**/*.ts'

commit-msg:
  commands:
    conventional:
      run: bunx commitlint --edit {1}
