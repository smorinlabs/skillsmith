version: 2

project_name: skillsmith
dist: dist/release

snapshot:
  version_template: "{{ .Version }}"

builds:
  - id: skillsmith
    builder: bun
    binary: skillsmith
    main: packages/cli/src/index.ts
    targets:
      - darwin-arm64
      - darwin-x64
      - linux-arm64
      - linux-x64
    flags:
      - --compile
      - --bytecode
      - --env=disable
      - --no-compile-autoload-dotenv
      - --no-compile-autoload-bunfig

archives:
  - id: skillsmith
    ids:
      - skillsmith
    formats:
      - tar.gz
    name_template: >-
      skillsmith-v{{ .Version }}-{{ .Os }}-{{ if eq .Arch "amd64" }}x64{{ else }}{{ .Arch }}{{ end }}
    files:
      - src: LICENSE
        dst: LICENSE
        info:
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: build/release-input/completions/skillsmith.bash
        dst: completions/skillsmith.bash
        info:
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: build/release-input/completions/_skillsmith
        dst: completions/_skillsmith
        info:
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: build/release-input/completions/skillsmith.fish
        dst: completions/skillsmith.fish
        info:
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"
    builds_info:
      owner: root
      group: root
      mode: 0755
      mtime: "{{ .CommitDate }}"

checksum:
  name_template: SHA256SUMS
  algorithm: sha256

changelog:
  disable: true

report_sizes: true

homebrew_casks:
  - name: skillsmith
    ids:
      - skillsmith
    binaries:
      - skillsmith
    completions:
      bash: completions/skillsmith.bash
      zsh: completions/_skillsmith
      fish: completions/skillsmith.fish
    homepage: https://github.com/smorinlabs/skillsmith
    description: Unify skill discovery and management across AI coding tools
    directory: Casks
    url:
      template: >-
        https://github.com/smorinlabs/skillsmith/releases/download/{{ .Tag }}/{{ .ArtifactName }}
      verified: github.com/smorinlabs/skillsmith/
    repository:
      owner: smorinlabs
      name: homebrew-tap
    skip_upload: true
